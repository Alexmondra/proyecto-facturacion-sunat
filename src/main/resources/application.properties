# Server
server.port=${SERVER_PORT:}

# App
spring.application.name=facturacion-sunat
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.config.import=optional:file:.env[.properties]

# Datasource
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool (Optimizado para alto rendimiento en dev y prod)
spring.datasource.hikari.pool-name=FacturacionHikariPool
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:6}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${HIKARI_CONNECTION_TIMEOUT:20000}
spring.datasource.hikari.max-lifetime=${HIKARI_MAX_LIFETIME:1800000}
spring.datasource.hikari.idle-timeout=${HIKARI_IDLE_TIMEOUT:300000}
spring.datasource.hikari.validation-timeout=3000
# spring.datasource.hikari.connection-test-query=SELECT 1

# Optimizaciones de cache de consultas para PostgreSQL JDBC
spring.datasource.hikari.data-source-properties.prepareThreshold=5
spring.datasource.hikari.data-source-properties.preparedStatementCacheQueries=256
spring.datasource.hikari.data-source-properties.preparedStatementCacheSizeMiB=5

# JPA / Hibernate
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none

# Liquibase
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-admin.xml
spring.liquibase.default-schema=public

# Multi-Tenancy
spring.jpa.properties.hibernate.multiTenancy=SCHEMA

# Storage por Tenant (Certificados, XML, CDR, PDF)
app.storage.base-path=${STORAGE_BASE_PATH:storage}

# Servicio Central de Identidad (DNI y RUC)
app.servicios.identidad.dni-url=${IDENTIDAD_DNI_URL:}
app.servicios.identidad.ruc-url=${IDENTIDAD_RUC_URL:}
app.servicios.identidad.api-key=${IDENTIDAD_API_KEY:}
app.servicios.identidad.timeout-ms=${IDENTIDAD_TIMEOUT_MS:}
